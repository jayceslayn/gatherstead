# TODO(deps): enable `minimumReleaseAge: 4320` (3 days — the Tier-1 patch window in
# docs/SECURITY-DEPS.md) to mechanically enforce the stand-off, which caret ranges cannot do on
# their own. NOT enabled yet: pnpm validates the policy against the committed lockfile on
# `pnpm install --frozen-lockfile`, and this lockfile currently pins nanoid@3.3.17 (published
# 2026-08-03), which the 3-day cutoff rejects — turning every CI install red. Safe to enable from
# 2026-08-06, once that entry has aged past the window; verify with `pnpm install --frozen-lockfile`
# in BOTH this project and docs-site before committing.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

overrides:
  # GHSA-2v37-7h3g-55p8 (high): custom generators loop indefinitely when size is 0. Reached
  # transitively via postcss (itself pulled in by vite and @vue/compiler-sfc); patched 3.3.18.
  nanoid: ">=3.3.18"
  # GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g (high): untrusted browserslist-stats.json can crash
  # the process or write to Object.prototype. Reached via @babel/helper-compilation-targets
  # (nuxt's Vite/Nitro build pipeline); patched 4.28.7.
  browserslist: ">=4.28.7"
  "esbuild": ">=0.28.1"
  # Overrides shadow the direct dependency too, so keep this floor in step with package.json.
  serialize-javascript: ">=7.0.7 <8"
  node-forge: ">=1.4.0"
  "picomatch@2": "^2.3.2"
  "picomatch@4": "^4.0.4"
  lodash: ">=4.17.24"
  defu: ">=6.1.5"
  # Bounded to the 8.x line: @nuxt/vite-builder 4.5.2 depends on vite ^8.2.0. Moving to vite 8 is
  # what forces vitest 4 (vitest 3 caps at vite ^7) and therefore @nuxt/test-utils 4.
  vite: ">=8.2.0 <9"
  h3: ">=1.15.9"
  # @redocly/openapi-core (via openapi-typescript) pins js-yaml to an exact 4.1.1; every other
  # consumer already floats to 4.2.0. Must stay on the 4.x line: 5.x is a breaking API change.
  # 4.3.0 patches GHSA-52cp-r559-cp3m (quadratic CPU via merge-key chains).
  # 4.3.1 patches GHSA-8cp3-6hjf-hh8h (high, quadratic CPU in !!omap) — 4.3.0 is still vulnerable.
  # 4.3.2 patches GHSA-2883-xcg3-v3hh (high, maxTotalMergeKeys doesn't limit CPU for empty merge
  # sources) — 4.3.1 is still vulnerable.
  js-yaml: ">=4.3.2 <5"
  srvx: ">=0.11.13"
  # Now bounded to the 3.x line. nuxt >= 4.5.0 depends on unhead ^3, which is required to patch five
  # HIGH nuxt advisories (see the security notes in docs/SECURITY-DEPS.md). The old 2.x bound existed
  # because unhead 3 removed hooks.hookOnce, which @nuxt/ui 4.9.0 called — @nuxt/ui 4.10.0 no longer
  # calls it and uses only injectHead/useHead/createHead, all stable in v3.
  # @unhead/vue is overridden alongside it: @nuxt/ui 4.10.0 still *declares* ^2.1.15, and without
  # this it would resolve a second, nested v2 copy whose injection key differs from Nuxt's v3 head,
  # silently breaking head management rather than failing the build.
  unhead: ">=3.3.1 <4"
  "@unhead/vue": ">=3.3.1 <4"
  # GHSA-r28c-9q8g-f849 (high): path traversal in previous-source-map auto-loading, patched 8.5.18.
  # GHSA-fxqj-rqcc-2cmp: incomplete fix of GHSA-6g55-p6wh-862q, patched 8.5.23 — so the floor is 8.5.23.
  # Bounded to 8.x; 9.x would be a breaking API change for every consumer in the tree.
  postcss: ">=8.5.23 <9"
  simple-git: ">=3.36.0"
  nitropack: ">=2.13.4"
  # Three DoS advisories, each patched separately on every major line, so pin all three lines that
  # appear in the tree (minimatch 3 -> 1.x, minimatch 5/9 -> 2.x, minimatch 10 -> 5.x). Each must
  # stay bounded to its own major: unbounded, the 1.x/2.x floors let minimatch jump the whole way to
  # a 5.x that is itself still vulnerable.
  #   GHSA-3jxr-9vmj-r5cp — exponential expansion of consecutive non-expanding {} groups.
  #   GHSA-mh99-v99m-4gvg — unbounded expansion length.
  #   GHSA-rgw5-rvv9-x895 — unbounded intermediate arrays, bypassing the above fix. Sets the floors:
  #                         1.1.18 / 2.1.4 / 5.0.9.
  "brace-expansion@1": ">=1.1.18 <2"
  "brace-expansion@2": ">=2.1.4 <3"
  "brace-expansion@5": ">=5.0.9 <6"
  # GHSA-96hv-2xvq-fx4p (high): memory-exhaustion DoS from tiny fragments/data chunks, patched 8.21.0.
  ws: ">=8.21.0"
  # 1.8.5 patches GHSA-395f-4hp3-45gv (quadratic-complexity DoS in parse()).
  shell-quote: ">=1.8.5"
  # node-tar < 7.5.19: GHSA-23hp-3jrh-7fpw (critical, decompression/parse DoS) plus
  # GHSA-8x88-c5mf-7j5w (infinite loop on negative entry size).
  # GHSA-r292-9mhp-454m: uncontrolled recursion in mapHas/filesFilter, patched 7.5.21.
  tar: ">=7.5.21"
  # GHSA-2p49-hgcm-8545: svgo's removeScripts plugin leaves some executable scripts intact (XSS).
  # Both consumers (ipx, postcss-svgo) are on the 4.x line, so keep the override bounded there.
  # GHSA-w27v-7q3p-w38r (high) + GHSA-4vpr-x523-8j87 (moderate): two more removeScripts bypasses
  # (namespace/control-char links, and foreignObject HTML), patched 4.1.0.
  svgo: ">=4.1.0 <5"
  # GHSA-f88m-g3jw-g9cj: sharp < 0.35.0 bundles a libvips with four CVEs. Patched only on the 0.35
  # line, which is a major bump for ipx (declares ^0.34); bounded to 0.35.x. Requires node >=20.9,
  # satisfied by the node 24 used in CI.
  # GHSA-rgj7-g3m4-5g8c (high): two more libheif CVEs (GHSA-g89c-p67h-r497, GHSA-2jg2-4ch7-h545),
  # patched 0.35.4.
  sharp: ">=0.35.4 <0.36"
  # happy-dom < 20.8.9 has critical VM-escape RCE + related advisories. It is only an optional peer
  # of vitest/@nuxt/test-utils (our tests run in the node environment and never load it); pin the
  # patched line. Consumers' peer range is '*', so this satisfies them. Drop once a consumer pins past it.
  happy-dom: ">=20.8.9"
  # GHSA-5qjj-4xww-7phc: record() issue paths make flatten() throw for invalid keys. Reached via
  # @nuxt/ui's optional validation-library peers; bounded to 1.x since 2.x is a breaking API change.
  valibot: ">=1.4.2 <2"
  # GHSA-9rgm-9g3h-6x36 (moderate): DoS via malformed input, patched 5.9.1. Reached via nuxt/
  # @nuxtjs/i18n, which declare ^5.9.0; bounded to the 5.x line.
  devalue: ">=5.9.1 <6"
  # GHSA-cp6q-959q-f8rh (moderate): mergeAttributes() turns an own __proto__ key into inherited
  # executable DOM attributes, patched 3.30.4.
  # GHSA-j95f-988m-3j2f (high): quadratic ReDoS in block/inline Markdown attribute parsing, patched
  # 3.30.5. Reached via @nuxt/ui's rich-text editor, which declares ^3; bounded to the 3.x line.
  "@tiptap/core": ">=3.30.5 <4"
