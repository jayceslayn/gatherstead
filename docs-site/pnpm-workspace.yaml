# TODO(deps): enable `minimumReleaseAge: 4320` here at the same time as in
# ../src/Gatherstead.Web/pnpm-workspace.yaml. Before enabling, check the youngest resolved versions
# in both lockfiles and verify both frozen installs; the previously noted nanoid@3.3.17 blocker has
# aged out, but does not prove every current entry meets the window.

# Native/build-script dependencies this project trusts to run install scripts (pnpm 11+).
# Mirrors the allowlist convention in ../src/Gatherstead.Web/pnpm-workspace.yaml.
allowBuilds:
  esbuild: true
  sharp: true

# Transitive advisory floors. Deliberately NOT a copy of the web project's override block:
# astro 7.1.x requires vite ^8, so web's `vite: ">=7.3.2 <8"` bound would break this build.
# Only add keys here that a resolved version in pnpm-lock.yaml actually needs.
overrides:
  # GHSA-2v37-7h3g-55p8 (high): custom generators loop indefinitely when size is 0. Reached
  # transitively via postcss (pulled in by vite); patched 3.3.18.
  nanoid: ">=3.3.18"
  # GHSA-f88m-g3jw-g9cj (high): sharp < 0.35.0 bundles a libvips with four CVEs. Astro's
  # `sharp ^0.34.0 || ^0.35.0` range permits a vulnerable 0.34.x resolution, so keep a direct
  # 0.35.x dependency and bound transitive resolution to that line. Requires node >=20.9.
  # GHSA-rgj7-g3m4-5g8c (high): two more libheif CVEs (GHSA-g89c-p67h-r497, GHSA-2jg2-4ch7-h545),
  # patched 0.35.4.
  sharp: ">=0.35.5 <0.36"
  # GHSA-ch52-4w7c-c8xp: the released fixed version is 4.3.0 (4.2.1 is not published).
  http-cache-semantics: ">=4.2.1 <5"
  # @expressive-code/core still requests postcss-nested ^6, whose parser line has no security fix.
  # v8 retains the plugin API; it is ESM and drops Node 18/20, while CI uses Node 24.
  "postcss-nested": ">=8.0.1 <9"
  # GHSA-rj75-hqrm-r3gf: move the docs tree off the affected 6.x selector-parser line.
  "postcss-selector-parser": ">=7.1.6 <8"
  # GHSA-2p49-hgcm-8545 (high): svgo's removeScripts plugin leaves some executable scripts intact
  # (XSS). astro still declares `svgo ^4.0.1`, so this floor is required independently of the bump.
  # GHSA-w27v-7q3p-w38r (high) + GHSA-4vpr-x523-8j87 (moderate): two more removeScripts bypasses
  # (namespace/control-char links, and foreignObject HTML), patched 4.1.0.
  svgo: ">=4.1.0 <5"
  # GHSA-7p8r-x3mc-p8w7 / GHSA-v2hh-gcrm-f6hx (high): host confusion via backslash authority.
  # Reached through ajv; bounded to 3.x since 4.x is a breaking API change.
  # GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf / GHSA-jqff-g426-hqxp (all
  # high): IDN, IPv6, and percent-decoding host-confusion/SSRF variants, patched 3.1.6.
  fast-uri: ">=3.1.6 <4"
  # GHSA-r28c-9q8g-f849 (high, path traversal) + GHSA-fxqj-rqcc-2cmp (incomplete fix of
  # GHSA-6g55-p6wh-862q, patched 8.5.23). Reached via expressive-code and postcss-nested.
  postcss: ">=8.5.23 <9"
  # GHSA-8cp3-6hjf-hh8h (high): quadratic CPU consumption in !!omap. Bounded to the 4.x line;
  # 5.x is a breaking API change for every consumer in the tree.
  # GHSA-2883-xcg3-v3hh (high): maxTotalMergeKeys doesn't limit CPU for empty merge sources,
  # patched 4.3.2 — 4.3.1 is still vulnerable.
  js-yaml: ">=4.3.2 <5"
  # GHSA-9rgm-9g3h-6x36 (moderate): DoS via malformed input, patched 5.9.1. Reached via astro,
  # which declares ^5.8.1; bounded to the 5.x line.
  devalue: ">=5.9.1 <6"
  # GHSA-7w5x-hrqm-74c2 (high): DoS via malformed TOML documents, patched 1.7.1. Reached via astro,
  # which declares ^1.6.0; bounded to the 1.x line.
  smol-toml: ">=1.8.1 <2"
  # GHSA-68fv-2mgg-jv7q: source-map-js 1.2.2 contains the fix.
  "source-map-js": ">=1.2.2 <2"
  # Astro currently resolves Undici 8.x; keep it on the fixed line.
  undici: ">=8.10.2 <9"
