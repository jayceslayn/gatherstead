version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      nuget-patches:
        update-types: [patch]
      nuget-minor:
        update-types: [minor]

  - package-ecosystem: npm
    directory: /src/Gatherstead.Web
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-patches:
        update-types: [patch]
      npm-minor:
        update-types: [minor]
    ignore:
      - dependency-name: serialize-javascript
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # Blocked on the @nuxt/ui -> unhead 3 chokepoint, not on version quality. These modules'
      # next releases require @nuxt/kit ^4.5.x, but nuxt is held at 4.4.8 because @nuxt/ui 4.x
      # still needs @unhead/vue ^2. Taking them nests a second @nuxt/kit, which duplicates the
      # schema/hook registry and fails subtly — CI can go green while the app is broken.
      # Because these are minors they would otherwise land in the merge-once-green npm-minor
      # group. Remove all three together with the nuxt 4.5 upgrade.
      # See .agents/skills/dependency-audit/SKILL.md section 3.
      - dependency-name: "@nuxt/icon"
        update-types:
          - version-update:semver-minor
      - dependency-name: "@nuxt/image"
        update-types:
          - version-update:semver-minor
      - dependency-name: "@nuxtjs/i18n"
        update-types:
          - version-update:semver-minor

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      docs-patches:
        update-types: [patch]
      docs-minor:
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ["*"]
