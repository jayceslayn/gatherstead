name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit-nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Audit NuGet dependencies
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.log
          if grep -q "has the following vulnerable packages" audit.log; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

  audit-pnpm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Gatherstead.Web
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the project's "packageManager" field — the single source of
      # truth. Do not hardcode `version:` here; that is how three different pnpm versions ended
      # up acting on one lockfile.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: src/Gatherstead.Web/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: src/Gatherstead.Web/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit pnpm dependencies
        run: pnpm audit --audit-level=high

  audit-pnpm-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs-site/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit pnpm dependencies
        run: pnpm audit --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
